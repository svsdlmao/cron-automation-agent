name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-real-cron:
    name: Ubuntu + real cron daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit, MCP and agent tests
        run: pytest -q
      - name: Start the cron daemon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cron
          sudo service cron start
          pgrep -x cron
      - name: Tests against the real crontab binary
        run: CRON_AGENT_SYSTEM_TESTS=1 pytest -q tests/test_system_backend.py
      - name: Live check - crond runs a job the agent installed
        run: python docker/live_cron_check.py

  windows:
    name: Windows + built-in daemon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: All tests (file backend, daemon runs jobs through Git Bash)
        run: pytest -q
