[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-agent"
version = "1.0.0"
description = "Schedule Linux cron jobs from plain English — validated, approved and reversible."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shauryaveer Singh Dabas" }]
dependencies = [
    "mcp>=1.2",
    "croniter>=2.0",
    "cron-descriptor>=1.4",
    "prompt_toolkit>=3.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
dev = ["pytest>=8"]

[project.scripts]
cron-agent = "cron_agent.__main__:main"

[tool.setuptools]
packages = ["cron_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
